# Local development only: no cloud resource creation.
name: carthaya-dev
services:
  db:
    image: library/mariadb@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
    command:
    - mariadbd
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_general_ci
    environment:
      MARIADB_DATABASE: openmrs
      MARIADB_USER: openmrs
      MARIADB_PASSWORD: ${CARTHAYA_DB_PASSWORD:?Set CARTHAYA_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${CARTHAYA_DB_ROOT_PASSWORD:?Set CARTHAYA_DB_ROOT_PASSWORD
        in .env}
    volumes:
    - openmrs-db:/var/lib/mysql
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: infra/render/backend/Dockerfile
    environment:
      OMRS_CONFIG_CONNECTION_SERVER: db
      OMRS_CONFIG_CONNECTION_DATABASE: openmrs
      OMRS_CONFIG_CONNECTION_USERNAME: openmrs
      OMRS_CONFIG_CONNECTION_PASSWORD: ${CARTHAYA_DB_PASSWORD:?Set CARTHAYA_DB_PASSWORD
        in .env}
      OMRS_CONFIG_ADMIN_USER_PASSWORD: ${CARTHAYA_ADMIN_PASSWORD:?Set CARTHAYA_ADMIN_PASSWORD
        in .env}
      OMRS_CONFIG_CREATE_TABLES: 'true'
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: 'true'
      OMRS_CONFIG_MODULE_WEB_ADMIN: 'false'
      OMRS_JAVA_MEMORY_OPTS: -Xms256m -Xmx2560m
    volumes:
    - openmrs-data:/openmrs/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    image: openmrs/openmrs-reference-application-3-frontend@sha256:f6b1f8443ab27a6b1c3944c5a948f2e0cdfea3701dcfd59316677fef28a58f8d
    environment:
      SPA_PATH: /openmrs/spa
      API_URL: /openmrs
      SPA_CONFIG_URLS: ''
      SPA_DEFAULT_LOCALE: fr
    restart: unless-stopped
  gateway:
    build:
      context: .
      dockerfile: infra/render/gateway/Dockerfile
    environment:
      PORT: '8080'
      OPENMRS_BACKEND_HOST: backend
      OPENMRS_FRONTEND_HOST: frontend
    ports:
    - 127.0.0.1:8080:8080
    depends_on:
    - backend
    - frontend
    restart: unless-stopped
volumes:
  openmrs-db: {}
  openmrs-data: {}
